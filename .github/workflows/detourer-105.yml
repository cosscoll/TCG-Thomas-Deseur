name: Detourer les 105 illustrations officielles (préproduction)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/detourer-105.py'
      - '.github/workflows/detourer-105.yml'
permissions:
  contents: write
concurrency:
  group: tcg-detourage-105
  cancel-in-progress: false
jobs:
  cutout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer le détourage sur processeur sans service payant
        run: python -m pip install 'rembg[cpu]==2.0.67' 'Pillow==11.3.0'
      - name: Générer 105 sujets sur fond uniforme sans toucher aux originaux
        run: python scripts/detourer-105.py
      - name: Vérifier les 105 sorties et les empreintes des originaux
        run: python scripts/detourer-105.py --check
      - name: Conserver les 105 versions et une planche de contrôle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collection-validee/assets/detourees/ data/detourage-105.json audit-visuels/assets/detourage-105-contact-sheet.jpg
          if git diff --cached --quiet; then
            echo "Aucune nouvelle illustration."
          else
            git commit -m "assets: 105 characters isolated on one solid-gray background; await review"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
