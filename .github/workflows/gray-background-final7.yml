name: Les 7 dernières cartes — prolonger uniquement le fond gris

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tcg-gray-background-final7
  cancel-in-progress: false

jobs:
  produce:
    name: Produire les 7 dernières cartes sans retoucher les originaux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Installer Pillow
        run: python -m pip install 'Pillow==11.3.0'
      - name: Ajouter uniquement le fond gris
        run: python scripts/extend-gray-background-final7.py
      - name: Vérifier pixels, tailles et miniatures
        run: python scripts/extend-gray-background-final7.py --check
      - name: Publier les images et leurs preuves
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collection-validee/assets/gray-extended-final7/ collection-validee/assets/gray-thumbs-final7/ data/gray-background-final7.json audit-visuels/assets/gray-background-final7-before-after.jpg
          if git diff --cached --quiet; then
            echo "Les 7 dernières cartes sont déjà produites."
          else
            git commit -m "assets(images): extend gray backgrounds for official cards 61-67 without cropping"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
