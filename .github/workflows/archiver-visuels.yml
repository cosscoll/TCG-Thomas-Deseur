name: Archives originales des 177 visuels

on:
  push:
    branches: [main]
    paths:
      - "scripts/telecharger-visuels-originaux.py"
      - "research/visual-references.json"
      - ".github/workflows/archiver-visuels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creer-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Charger les sources officielles du dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Télécharger les 177 images originales, sans IA
        run: python scripts/telecharger-visuels-originaux.py
      - name: Fournir une archive ZIP téléchargeable
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 177-visuels-originaux
          path: |
            dist/177-visuels-originaux-thomas-deseur.zip
            dist/resultat-telechargement.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
