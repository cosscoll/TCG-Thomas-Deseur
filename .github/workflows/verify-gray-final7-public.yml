name: Vérifier les cartes 61-67 publiées sans recadrage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-final7-live.py'
      - '.github/workflows/verify-gray-final7-public.yml'
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: tcg-gray-final7-public-smoke
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Inspecter les sept visuels publics et les comparer pixel à pixel
        run: python scripts/verify-final7-live.py
