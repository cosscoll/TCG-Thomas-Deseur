name: Publier la galerie des 177 photos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-tri-177.yml"
      - "scripts/import-tri-177.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tcg-tri177-import
  cancel-in-progress: false

jobs:
  gallery:
    name: Importer et vérifier les 177 images comparées
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger, vérifier et extraire les 177 images
        run: python scripts/import-tri-177.py
      - name: Vérifier les fichiers publiés
        run: |
          test -f tri-177/index.html
          test -f tri-177/Catalogue_177_images.csv
          test -f tri-177/Groupes_70_costumes.csv
          test "$(find tri-177/images_nommes -type f -name '*.webp' | wc -l)" -eq 177
          test "$(find tri-177/planches -type f -name '*.jpg' | wc -l)" -eq 7
      - name: Enregistrer l'atelier dans le dépôt public
        run: |
          git config user.name "TCG Deseur CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tri-177/
          if git diff --staged --quiet; then
            echo "La galerie est déjà à jour"
          else
            git commit -m "feat: publier les 177 photos classées en 70 groupes pour revue"
            git push
          fi
