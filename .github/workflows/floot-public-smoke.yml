name: Floot — contrôle public (sans compte)

on:
  workflow_dispatch:
    inputs:
      beta_unlimited:
        description: "Activer les tests navigateur de deux boosters consécutifs APRÈS publication du mode illimité Floot"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - "scripts/check_floot_guest_security.mjs"
      - ".github/workflows/floot-public-smoke.yml"
  push:
    branches: [main]
    paths:
      - "floot-e2e/**"
      - "scripts/check_floot_public.py"
      - "scripts/check_floot_guest_security.mjs"
      - ".github/workflows/floot-public-smoke.yml"

permissions:
  contents: read

concurrency:
  group: tcg-floot-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anonymous-security:
    name: Sécurité des API sans compte
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Vérifier les quatre API privées sans cookie (aucune récompense)
        run: node --test scripts/check_floot_guest_security.mjs

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Exécuter les tests unitaires hors réseau (contrôles et sauvegarde)
        run: python -m unittest discover -s floot-e2e -p 'test_*.py' -v
      - name: Contrôler les pages et le refus des appels anonymes
        run: python scripts/check_floot_public.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Installer Playwright pour les vérifications publiques
        run: npm install --no-save @playwright/test@1.56.1
      - name: Installer Chromium et ses dépendances
        run: npx playwright install --with-deps chromium
      - name: Tester les pages publiques sur ordinateur et mobile
        env:
          TCG_BETA_UNLIMITED: ${{ github.event_name == 'workflow_dispatch' && inputs.beta_unlimited && '1' || '0' }}
        run: npx playwright test --config=floot-e2e/playwright.config.mjs
      - name: Conserver les traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: floot-public-smoke-echec
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
