name: Floot — contrôle public (sans compte)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "floot-e2e/**"
      - "scripts/check_floot_public.py"
      - "scripts/check_floot_guest_security.mjs"
      - ".github/workflows/floot-public-smoke.yml"

permissions:
  contents: read

concurrency:
  group: tcg-floot-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anonymous-security:
    name: Sécurité des API sans compte
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier les quatre API privées sans cookie (aucune récompense)
        run: node --test scripts/check_floot_guest_security.mjs

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exécuter les tests unitaires hors réseau (contrôles et sauvegarde)
        run: python -m unittest discover -s floot-e2e -p 'test_*.py' -v
      - name: Contrôler les pages et le refus des appels anonymes
        run: python scripts/check_floot_public.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer Playwright pour les vérifications publiques
        run: npm install --no-save @playwright/test@1.56.1
      - name: Installer Chromium et ses dépendances
        run: npx playwright install --with-deps chromium
      - name: Tester les pages publiques sur ordinateur et mobile
        run: npx playwright test --config=floot-e2e/playwright.config.mjs
      - name: Conserver les traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: floot-public-smoke-echec
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
