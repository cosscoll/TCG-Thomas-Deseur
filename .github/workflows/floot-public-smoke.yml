name: Floot — contrôle public (sans compte)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier le script sans accès réseau
        run: python -m unittest discover -s floot-e2e -p 'test_public_check.py' -v
      - name: Contrôler les pages et le refus des appels anonymes
        run: python scripts/check_floot_public.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer Playwright pour les vérifications publiques
        run: npm install --no-save @playwright/test@1.56.1
      - name: Installer Chromium et ses dépendances
        run: npx playwright install --with-deps chromium
      - name: Tester les pages publiques sur ordinateur et mobile
        run: npx playwright test --config=floot-e2e/playwright.config.mjs
      - name: Conserver les traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: floot-public-smoke-echec
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
