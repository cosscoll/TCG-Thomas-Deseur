name: Vérifier les huit dernières variantes publiées sans recadrage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-variants04-live.py'
      - '.github/workflows/verify-gray-variants04-public.yml'
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: tcg-gray-variants04-public-smoke
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Inspecter les huit variantes publiées et les comparer pixel à pixel
        run: python scripts/verify-variants04-live.py
