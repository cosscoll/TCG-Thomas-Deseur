name: Verify TCG Deseur

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "data/**"
      - "game/**"
      - "account/**"
      - "solo/**"
      - "supabase/**"
      - "e2e/**"
      - "research/**"
      - "tests/**"
      - "floot-collection/**"
      - "package.json"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "data/**"
      - "game/**"
      - "account/**"
      - "solo/**"
      - "supabase/**"
      - "e2e/**"
      - "research/**"
      - "tests/**"
      - "floot-collection/**"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Run Node.js tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
