name: Verify TCG Deseur

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "data/**"
      - "game/**"
      - "account/**"
      - "solo/**"
      - "supabase/**"
      - "e2e/**"
      - "research/**"
      - "tests/**"
      - "floot-collection/**"
      - "collection-161/**"
      - "collection-validee/**"
      - "tri-177/**"
      - "server/**"
      - "scripts/generate-seed-161.mjs"
      - "package.json"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "data/**"
      - "game/**"
      - "account/**"
      - "solo/**"
      - "supabase/**"
      - "e2e/**"
      - "research/**"
      - "tests/**"
      - "floot-collection/**"
      - "collection-161/**"
      - "collection-validee/**"
      - "tri-177/**"
      - "server/**"
      - "scripts/generate-seed-161.mjs"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcg-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Run Node.js tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reconstruire le catalogue confirmé et vérifier la reproductibilité
        run: |
          node scripts/build-approved-catalogue.mjs
          git diff --exit-code -- data/catalogue-valide-67.json
      - name: Exécuter tous les tests métier Node
        run: npm test

  binder-browser:
    name: Classeur fictif — Chromium ordinateur et mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer le moteur de tests navigateur
        run: npm install --no-save @playwright/test@1.56.1 @axe-core/playwright@4.10.2
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Vérifier le classeur fictif et la collection approuvée sur ordinateur et mobile
        run: npx playwright test --config=floot-collection/playwright.config.mjs
      - name: Conserver captures et traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: binder-demo-browser-failures
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  pages-public:
    name: Contrôler le catalogue réellement publié sur GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Attendre la propagation GitHub Pages puis vérifier les vrais fichiers HTTP
        run: python scripts/check_published_approved.py
