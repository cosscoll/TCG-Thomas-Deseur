name: Verify TCG Deseur

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "data/**"
      - "game/**"
      - "account/**"
      - "solo/**"
      - "supabase/**"
      - "e2e/**"
      - "research/**"
      - "tests/**"
      - "floot-collection/**"
      - "collection-161/**"
      - "collection-validee/**"
      - "audit-visuels/**"
      - "beta/**"
      - "tri-177/**"
      - "server/**"
      - "scripts/generate-seed-161.mjs"
      - "scripts/build-approved-catalogue.mjs"
      - "scripts/check_published_approved.py"
      - "scripts/check-migration-compat.mjs"
      - "scripts/stage-approved-edition.mjs"
      - "scripts/generate-approved-staging.mjs"
      - "scripts/validate-rarity-decisions.mjs"
      - "package.json"
      - ".github/workflows/**"
      - "scripts/check_security_policies.py"
      - "floot-app/endpoints/**"
      - "floot-app/helpers/tcgReadLimitedBody.tsx"
      - "floot-app/helpers/TcgRequestBodyError.tsx"
      - "floot-app/helpers/tcgAuthRateLimit.tsx"
      - "floot-app/helpers/tcgIpDigest.tsx"
      - "security/tcg-auth-ip-rate-windows.sql"
      - "tests/auth-ip-limiter-source.test.mjs"
      - "floot-app/helpers/tcgMutationGuard.tsx"
      - "tests/auth-security-source.test.mjs"
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "data/**"
      - "game/**"
      - "account/**"
      - "solo/**"
      - "supabase/**"
      - "e2e/**"
      - "research/**"
      - "tests/**"
      - "floot-collection/**"
      - "collection-161/**"
      - "collection-validee/**"
      - "audit-visuels/**"
      - "beta/**"
      - "tri-177/**"
      - "server/**"
      - "scripts/generate-seed-161.mjs"
      - "scripts/build-approved-catalogue.mjs"
      - "scripts/check_published_approved.py"
      - "scripts/check-migration-compat.mjs"
      - "scripts/stage-approved-edition.mjs"
      - "scripts/generate-approved-staging.mjs"
      - "scripts/validate-rarity-decisions.mjs"
      - "package.json"
      - ".github/workflows/**"
      - "scripts/check_security_policies.py"
      - "floot-app/endpoints/**"
      - "floot-app/helpers/tcgReadLimitedBody.tsx"
      - "floot-app/helpers/TcgRequestBodyError.tsx"
      - "floot-app/helpers/tcgAuthRateLimit.tsx"
      - "floot-app/helpers/tcgIpDigest.tsx"
      - "security/tcg-auth-ip-rate-windows.sql"
      - "tests/auth-ip-limiter-source.test.mjs"
      - "floot-app/helpers/tcgMutationGuard.tsx"
      - "tests/auth-security-source.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcg-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Run Node.js tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Reconstruire le catalogue confirmé et vérifier la reproductibilité
        run: |
          node scripts/build-approved-catalogue.mjs
          git diff --exit-code -- data/catalogue-valide-67.json
          node scripts/check-migration-compat.mjs
          node scripts/validate-rarity-decisions.mjs data/raretes-validees-67.json --require-complete
          node scripts/stage-approved-edition.mjs
          node scripts/generate-approved-staging.mjs --check
      - name: Contrôler les autorisations des workflows et la publication publique
        run: python scripts/check_security_policies.py
      - name: Exécuter tous les tests métier Node
        run: npm test

  binder-browser:
    name: Classeur fictif — Chromium ordinateur et mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Installer le moteur de tests navigateur
        run: npm install --no-save @playwright/test@1.56.1 @axe-core/playwright@4.10.2
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Vérifier le classeur fictif et la collection approuvée sur ordinateur et mobile
        run: npx playwright test --config=floot-collection/playwright.config.mjs
      - name: Conserver captures et traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binder-demo-browser-failures
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  pages-public:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Contrôler le catalogue réellement publié sur GitHub Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Attendre la propagation GitHub Pages puis vérifier les vrais fichiers HTTP
        run: python scripts/check_published_approved.py
