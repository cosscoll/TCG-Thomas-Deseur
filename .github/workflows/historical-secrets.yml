name: Audit historique Git — sans secrets dans les journaux
on:
  push:
    branches: [main]
    paths:
      - "scripts/scan_git_history_secrets.py"
      - ".github/workflows/historical-secrets.yml"
  pull_request:
    paths:
      - "scripts/scan_git_history_secrets.py"
      - ".github/workflows/historical-secrets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-security-audit:
    name: Recherche d'identifiants dans l'historique Git
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Auditer les anciens commits sans jamais afficher de secret
        run: python scripts/scan_git_history_secrets.py
