name: Contrastes statiques accessibles

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tcg-static-contrast
  cancel-in-progress: false

jobs:
  contrast:
    name: Vérifier et publier 12 contrastes texte sur fond
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Tester formules et valeurs des paires
        run: node --test tests/contrast-static.test.mjs
      - name: Générer rapport statique
        run: node scripts/check-contrast-static.mjs --write
      - name: Conserver le rapport
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CONTRASTES_PUBLICS_2026-10-13.md
          if git diff --cached --quiet; then
            echo "Contrastes inchangés."
          else
            git commit -m "docs(a11y): update public static contrast report"
            git push origin HEAD:main
          fi
