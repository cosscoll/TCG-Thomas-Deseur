name: Vérifier les 10 variantes suivantes publiées sans recadrage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-variants02-live.py'
      - '.github/workflows/verify-gray-variants02-public.yml'
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: tcg-gray-variants02-public-smoke
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Inspecter les dix variantes publiées et les comparer pixel à pixel
        run: python scripts/verify-variants02-live.py
