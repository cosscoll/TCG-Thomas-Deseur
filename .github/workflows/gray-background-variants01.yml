name: Les 10 premières variantes — prolonger uniquement le fond gris

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/extend-gray-background-variants01.py'
      - '.github/workflows/gray-background-variants01.yml'

permissions:
  contents: write

concurrency:
  group: tcg-gray-background-variants01
  cancel-in-progress: false

jobs:
  produce:
    name: Produire les 10 premières variantes sans retoucher les originaux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow
        run: python -m pip install 'Pillow==11.3.0'
      - name: Ajouter uniquement le fond gris
        run: python scripts/extend-gray-background-variants01.py
      - name: Vérifier pixels, tailles et miniatures
        run: python scripts/extend-gray-background-variants01.py --check
      - name: Publier les images et leurs preuves
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collection-validee/assets/gray-extended-variants01/ collection-validee/assets/gray-thumbs-variants01/ data/gray-background-variants01.json audit-visuels/assets/gray-background-variants01-before-after.jpg
          if git diff --cached --quiet; then
            echo "Les 10 premières variantes sont déjà produites."
          else
            git commit -m "assets(images): extend gray backgrounds for official cards alternatives-01 without cropping"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
