name: E2E Collection Budget Illimite

on:
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "account/**"
      - "supabase/**"
      - "game/**"
      - "data/**"
      - "e2e/**"
      - ".github/workflows/browser-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Playwright
        run: npm install --no-save @playwright/test@1.56.1
      - name: Installer Chromium et ses dépendances
        run: npx playwright install --with-deps chromium
      - name: Parcours réels dans Chromium desktop et mobile
        run: npx playwright test --config=e2e/playwright.config.mjs
      - name: Rapports des tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-echec
          path: |
            test-results
            playwright-report
          retention-days: 7
          if-no-files-found: ignore
