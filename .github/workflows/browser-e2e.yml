name: E2E Collection TCG Deseur

on:
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "account/**"
      - "solo/**"
      - "supabase/**"
      - "game/**"
      - "data/**"
      - "e2e/**"
      - ".github/workflows/browser-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Installer Playwright
        run: npm install --no-save @playwright/test@1.56.1 @axe-core/playwright@4.10.2
      - name: Installer Chromium et ses dépendances
        run: npx playwright install --with-deps chromium
      - name: Parcours réels dans Chromium desktop et mobile
        run: npx playwright test --config=e2e/playwright.config.mjs
      - name: Rapports des tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-echec
          path: |
            test-results
            playwright-report
          retention-days: 7
          if-no-files-found: ignore
