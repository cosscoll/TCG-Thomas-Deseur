name: Miniatures mobiles 105 images approuvées

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tcg-deseur-thumbnails
  cancel-in-progress: false

jobs:
  thumbnails:
    name: Générer les 105 miniatures 384x512 sans écraser les originaux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Créer les miniatures
        run: python scripts/generate-approved-thumbnails.py
      - name: Vérifier les 105 hashes et dimensions
        run: python scripts/generate-approved-thumbnails.py --check
      - name: Publier les WebP mobiles séparément
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collection-validee/assets/thumbs data/thumbs-approved-105.json
          if git diff --cached --quiet; then
            echo "Aucune miniature à publier."
          else
            git commit -m "assets(perf): publish 105 approved 384x512 mobile WebP thumbnails"
            git push origin HEAD:main
          fi
