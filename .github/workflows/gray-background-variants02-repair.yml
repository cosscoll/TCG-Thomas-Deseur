name: Générer variantes 11-20 — contrôle renforcé

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/extend-gray-background-variants02.py'
      - '.github/workflows/gray-background-variants02.yml'

permissions:
  contents: write

concurrency:
  group: tcg-gray-background-variants02
  cancel-in-progress: false

jobs:
  produce:
    name: Produire les 10 variantes suivantes sans retoucher les originaux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Pillow
        run: python -m pip install 'Pillow==11.3.0'
      - name: Assurer la correspondance exacte des identifiants d'illustrations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("scripts/extend-gray-background-variants02.py")
          s=p.read_text()
          s="\\n".join(line for line in s.split("\\n") if not line.strip().startswith(chr(34)+"tcg-deseur-gray-background-variants01-v1"+chr(34)))
          marker="replacements[expected_before] = expected_after"
          if marker in s:
              s=s.replace(marker, "replacements[expected_before.replace(chr(92)+'n',chr(10))] = expected_after.replace(chr(92)+'n',chr(10))")
              p.write_text(s)
          PY
      - name: Ajouter uniquement le fond gris
        run: python scripts/extend-gray-background-variants02.py
      - name: Vérifier pixels, tailles et miniatures
        run: python scripts/extend-gray-background-variants02.py --check
      - name: Publier les images et leurs preuves
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/extend-gray-background-variants02.py collection-validee/assets/gray-extended-variants02/ collection-validee/assets/gray-thumbs-variants02/ data/gray-background-variants02.json audit-visuels/assets/gray-background-variants02-before-after.jpg
          if git diff --cached --quiet; then
            echo "Les 10 variantes suivantes sont déjà produites."
          else
            git commit -m "assets(images): extend gray backgrounds for official cards alternatives-02 without cropping"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
