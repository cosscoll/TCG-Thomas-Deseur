name: Importer les 161 illustrations

on:
  push:
    branches: [main]
    paths:
      - 'uploads/TCG_Deseur_161_Visuels_WEBP_GitHub.zip'
      - '.github/workflows/import-card-art.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tcg-card-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-art:
    name: Décompresser, vérifier et publier les illustrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger l'archive vérifiée depuis la bibliothèque publique Floot
        run: |
          mkdir -p uploads
          if [ ! -f uploads/TCG_Deseur_161_Visuels_WEBP_GitHub.zip ]; then
            curl --fail --location --retry 2 --max-time 100 --output uploads/TCG_Deseur_161_Visuels_WEBP_GitHub.zip \
              'https://budget-illimite-tcg.floot.app/_cdn/static/37c526f6-a403-4e06-8354-531d5544189b-TCG_Deseur_161_Visuels_WEBP_GitHub.zip'
          fi
      - name: Vérifier la présence du ZIP
        id: archive
        run: echo "exists=true" >> "$GITHUB_OUTPUT"
      - name: Contrôler et importer exactement 161 images
        if: steps.archive.outputs.exists == 'true'
        run: python scripts/import-card-art.py
      - name: Enregistrer les 161 illustrations sur GitHub
        if: steps.archive.outputs.exists == 'true'
        run: |
          git config user.name "TCG Deseur CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collection-161/assets/
          git rm -f --ignore-unmatch uploads/TCG_Deseur_161_Visuels_WEBP_GitHub.zip
          git commit -m "assets: publier les 161 illustrations TCG Deseur"
          git push
