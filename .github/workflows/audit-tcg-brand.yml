name: TCG Thomas Deseur — Audit de nomenclature
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-tcg-brand.yml"
      - "scripts/audit-tcg-brand.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-name:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Lister les références historiques sans modifier les données
        run: python scripts/audit-tcg-brand.py
