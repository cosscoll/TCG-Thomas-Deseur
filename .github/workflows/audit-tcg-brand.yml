name: TCG Thomas Deseur — Audit de nomenclature
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-tcg-brand.yml"
      - "scripts/audit-tcg-brand.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-name:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Lister les références historiques sans modifier les données
        run: python scripts/audit-tcg-brand.py
